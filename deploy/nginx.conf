# glob3x.al — reverse proxy to the Next.js app on 127.0.0.1:3001
# Managed by deploy/bootstrap.sh. certbot (--nginx) adds the TLS/443 block automatically.

upstream glob3x_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirect the bare apex/www over http to https is handled by certbot after it runs.
server {
    listen 80;
    listen [::]:80;
    server_name glob3x.al www.glob3x.al;

    # Let's Encrypt HTTP-01 challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10m;

    # Immutable Next.js build assets — cache hard.
    location /_next/static/ {
        proxy_pass http://glob3x_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded/static media — long cache, revalidated.
    location /media/ {
        proxy_pass http://glob3x_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://glob3x_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
